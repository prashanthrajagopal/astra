name: Docker Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - goal-service
          - execution-worker
          - llm-router
          - identity
          - webhook-ingest
          - access-control
          - agent-service
          - task-service
          - scheduler-service
          - worker-manager
          - memory-service
          - planner-service
          - prompt-manager
          - evaluation-service
          - browser-worker
          - cost-tracker
          - tool-runtime

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            prashanth86/astra:${{ matrix.service }}
            prashanth86/astra:${{ matrix.service }}-${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
